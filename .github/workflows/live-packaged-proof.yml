name: Live packaged native proof (no deployment)
on:
  push:
    branches: ['test/live-packaged-l10']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Read-only accepted manager input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dyne/gestalt
          ref: 4a01397a7939a1f633db1aea73dc24d243210883
          path: .host-manager-input
          persist-credentials: false
      - name: Prepare pinned native package and test Caddy
        run: |
          set -Eeuo pipefail
          tool_root="$RUNNER_TEMP/live-packaged-tools"
          mkdir -p "$tool_root"
          install -m0755 .host-manager-input/public/gestalt "$tool_root/gestalt"
          printf '%s  %s\n' 785f300578a98f214724b1f65b9a52d880cecf9429ab2dc30a099dbafd049ea7 "$tool_root/gestalt" | sha256sum --check --status
          npm install --prefix "$tool_root" --no-save --ignore-scripts @openai/codex@0.161.0
          native_binary="$tool_root/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          printf '%s  %s\n' 9a820c17865fa825d04db416818679a9d63bd72e50835c396f496e5684626c9c "$native_binary" | sha256sum --check --status
          curl --fail --silent --show-error --location \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$tool_root/caddy.tar.gz"
          printf '%s  %s\n' a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7 "$tool_root/caddy.tar.gz" | sha512sum --check --status
          tar -xzf "$tool_root/caddy.tar.gz" -C "$tool_root" caddy
          {
            echo "LIVE_HOST_MANAGER_BINARY=$tool_root/gestalt"
            echo "LIVE_HOST_CODEX_BINARY=$native_binary"
            echo "LIVE_HOST_CADDY_BINARY=$tool_root/caddy"
          } >> "$GITHUB_ENV"
      - name: Existing native prerequisites on disposable hosted runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -Eeuo pipefail
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [[ -n $current_userns && $current_userns != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [[ -n $current_apparmor && $current_apparmor != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Installed packaged tools under actual native policy
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-packaged
          node scripts/live-packaged-native-proof.mjs > test-results/live-packaged/proof.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-packaged-native-results
          path: test-results/live-packaged
          if-no-files-found: error
          retention-days: 30
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Test prerequisites
        run: |
          set -Eeuo pipefail
          npm install --global @openai/codex@0.161.0
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Full repository, installed package and exact discovery checks
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/live-packaged-ci
          bash tests/ci.sh > test-results/live-packaged-ci/ci.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-packaged-ci-results
          path: test-results/live-packaged-ci
          if-no-files-found: error
          retention-days: 30
