name: Test

on:
  workflow_call:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: 1.24.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install current Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Install Linux shell tools
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Install macOS shell tools
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils shellcheck
          echo "$(brew --prefix bash)/bin" >>"$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >>"$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        if: runner.os == 'Linux'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Run complete validation
        run: bash tests/ci.sh
